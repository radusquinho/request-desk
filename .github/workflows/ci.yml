name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db: [h2, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: requestdesk
          POSTGRES_USER: requestdesk
          POSTGRES_PASSWORD: requestdesk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U requestdesk" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Test
        run: |
          if [ "${{ matrix.db }}" = "postgres" ]; then export SPRING_PROFILES_ACTIVE=postgres; fi
          chmod +x mvnw && ./mvnw -B verify
        env:
          DB_URL: jdbc:postgresql://localhost:5432/requestdesk
          DB_USER: requestdesk
          DB_PASSWORD: requestdesk

  frontend:
    name: Frontend build + Playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: docker compose build
